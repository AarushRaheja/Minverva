name: python

on:
  push:
    paths-ignore: ["tui/**", "**.md"]
  pull_request:
    paths-ignore: ["tui/**", "**.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # test_grading.py drives the evaluation sandbox through macOS `sandbox-exec`, which Linux runners
      # don't have; run it locally on a Mac (`uv run pytest evaluation/tests`).
      - run: uv run pytest -q --deselect evaluation/tests/test_grading.py
